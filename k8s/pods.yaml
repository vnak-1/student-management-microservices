# Pod 1: api-gateway + registration-service (same pod, talk via localhost)
apiVersion: v1
kind: Pod
metadata:
  name: gateway-registration-pod
  labels:
    app: gateway-registration
spec:
  containers:
    - name: api-gateway-container
      image: api-gateway:v1
      imagePullPolicy: Never
      ports:
        - containerPort: 3000
      env:
        - name: PORT
          value: "3000"
        - name: REGISTRATION_URL
          value: "http://localhost:3001"
        - name: DELETE_URL
          value: "http://delete-service:3002"
    - name: registration-service-container
      image: registration-service:v1
      imagePullPolicy: Never
      ports:
        - containerPort: 3001
      env:
        - name: PORT
          value: "3001"
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: student-db-secret
              key: MONGO_URI
---
# Pod 2: delete-service
apiVersion: v1
kind: Pod
metadata:
  name: delete-pod
  labels:
    app: delete-service
spec:
  containers:
    - name: delete-service-container
      image: delete-service:v1
      imagePullPolicy: Never
      ports:
        - containerPort: 3002
      env:
        - name: PORT
          value: "3002"
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: student-db-secret
              key: MONGO_URI
