apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: student-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: studentms.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 3000
